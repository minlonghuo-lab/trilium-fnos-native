:root{color-scheme:light dark;--bg:#fff;--card:#f5f5f5;--ink:#333;--muted:#666;--input:#eaeaea;--border:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#202020;--card:#292929;--ink:#ddd;--muted:#aaa;--input:#363636;--border:#444}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:48px auto;padding:0 24px}header{display:flex;align-items:center;gap:12px}img{width:32px;height:32px}h1{font-size:25px;line-height:1.3;font-weight:600}h2{font-size:17px;margin:0 0 16px}p,li{color:var(--muted)}section{background:var(--card);padding:24px;border-radius:8px;margin:24px 0}.row{display:flex;gap:8px;margin:10px 0}input{flex:1;min-width:0;background:var(--input);color:var(--ink);border:0;border-radius:6px;padding:12px;font:inherit}button{background:var(--input);color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:8px 18px;font:inherit}a{color:inherit}small{color:var(--muted)}@media(max-width:480px){main{margin:24px auto}section{padding:16px}.row{flex-wrap:wrap}}

<header><img src="../trilium-fnos/ICON.PNG" alt="Trilium"><h1>电脑端同步</h1></header>
<p>在电脑端 Trilium Notes 中连接这台 NAS。</p>
<section><h2>服务器地址</h2><label for="address">局域网同步地址</label><div class="row"><input id="address" readonly value="http://〈NAS 局域网 IP〉:8080/"><button disabled>复制</button></div><small>布局占位，正式版本将显示 NAS 检测到的地址。</small></section>
<section><h2>连接方法</h2><ol><li>打开电脑端 Trilium 的同步设置。</li><li>填入服务器地址，并按客户端提示使用服务器的登录密码。</li><li>测试连接并开始同步。</li></ol><p>建议固定 NAS 的局域网 IP；外网连接请使用独立 HTTPS 地址。</p></section>
